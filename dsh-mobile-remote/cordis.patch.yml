# dsh-mobile-remote 插件包补丁：把本包挂进 DSH 宿主树。
#
# 形态先例：awesome-harness / dsh-codex-harness 的 bundle 补丁（insert 条目，
# name = 包名，宿主经包根出口 "." 解析插件模块：name/inject/apply）。
#
# profile 侧只需在 package.json 的 dsh.profile.bundles 里加上本包名，
# 本文件即作为一个 bundle 层被应用；无需改 profile 的 cordis.patch.yml。
- insert:
    - id: dsh-mobile-remote
      name: 'dsh-mobile-remote'
